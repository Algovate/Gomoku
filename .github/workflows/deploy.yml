name: Deploy to GitHub Pages

on:
  # 在推送到 main 分支时触发
  push:
    branches:
      - main
  # 允许手动触发部署
  workflow_dispatch:

# 设置 GitHub Pages 部署的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with base path
        run: |
          # 从 GITHUB_REPOSITORY 提取仓库名（格式：owner/repo）
          REPO_NAME=$(echo ${{ github.repository }} | cut -d '/' -f 2)
          # 如果不是用户/组织的主页仓库，设置 base path
          if [[ "$REPO_NAME" != *".github.io" ]]; then
            export VITE_BASE_PATH="/$REPO_NAME/"
          else
            export VITE_BASE_PATH="/"
          fi
          echo "Building with base path: $VITE_BASE_PATH"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

