<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Simplified icon version for favicon -->
  <defs>
    <radialGradient id="iconStoneGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="0.5"/>
  
  <!-- Five connected stones -->
  <!-- Black stones with highlight -->
  <circle cx="14" cy="32" r="7" fill="#1c1917" filter="url(#iconShadow)"/>
  <circle cx="14" cy="32" r="7" fill="url(#iconStoneGradient)"/>
  <circle cx="24" cy="32" r="7" fill="#1c1917" filter="url(#iconShadow)"/>
  <circle cx="24" cy="32" r="7" fill="url(#iconStoneGradient)"/>
  <circle cx="34" cy="32" r="7" fill="#1c1917" filter="url(#iconShadow)"/>
  <circle cx="34" cy="32" r="7" fill="url(#iconStoneGradient)"/>
  
  <!-- White stones with border -->
  <circle cx="44" cy="32" r="7" fill="#fafaf9" stroke="#1c1917" stroke-width="1.2" filter="url(#iconShadow)"/>
  <circle cx="44" cy="32" r="5.5" fill="url(#iconStoneGradient)" opacity="0.3"/>
  <circle cx="54" cy="32" r="7" fill="#fafaf9" stroke="#1c1917" stroke-width="1.2" filter="url(#iconShadow)"/>
  <circle cx="54" cy="32" r="5.5" fill="url(#iconStoneGradient)" opacity="0.3"/>
  
  <!-- Subtle connection line -->
  <line x1="21" y1="32" x2="47" y2="32" stroke="#78716c" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
</svg>
